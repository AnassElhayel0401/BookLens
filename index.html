<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookLens — Explorateur de livres</title>
    <link rel="stylesheet" href="css/style.css">
    <script>document.documentElement.dataset.theme = localStorage.getItem("booklens_theme") || "light";</script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                Book<span>Lens</span>
            </a>
            <nav class="main-nav">
                <a href="index.html" class="nav-link active">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    Recherche
                </a>
                <a href="bookshelf.html" class="nav-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                    Ma Bibliothèque <span id="fav-count" class="badge"></span>
                </a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Changer de thème"></button>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1>Explorez des millions de livres</h1>
            <p class="hero-subtitle">Recherchez par titre ou par auteur grâce à l'API Open Library</p>

            <form id="search-form" class="search-form">
                <select id="search-type" aria-label="Type de recherche">
                    <option value="q">Tout</option>
                    <option value="title">Titre</option>
                    <option value="author">Auteur</option>
                </select>
                <input type="text" id="search-input" placeholder="Ex : Le Petit Prince, Victor Hugo…"
                       autocomplete="off" required>
                <button type="submit" class="btn btn-primary" id="search-btn"></button>
            </form>
        </div>
    </section>

    <main class="container">
        <div id="toolbar" class="toolbar" hidden>
            <p id="results-count" class="results-count"></p>
            <label class="sort-label">
                Trier :
                <select id="sort-select">
                    <option value="">Pertinence</option>
                    <option value="new">Plus récents</option>
                    <option value="old">Plus anciens</option>
                    <option value="rating">Mieux notés</option>
                </select>
            </label>
        </div>

        <h2 id="section-title" class="section-title" hidden></h2>
        <div id="status" class="status" hidden></div>
        <div id="results" class="book-grid"></div>

        <div class="load-more-wrap">
            <button id="load-more" class="btn btn-outline" hidden>Charger plus de résultats</button>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>BookLens — Projet Applications Web · CentraleSupélec 2026 ·
               Données : <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a></p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
