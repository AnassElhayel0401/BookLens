<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Bibliothèque — BookLens</title>
    <link rel="stylesheet" href="css/style.css">
    <script>document.documentElement.dataset.theme = localStorage.getItem("booklens_theme") || "light";</script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="index.html" class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
                Book<span>Lens</span>
            </a>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    Recherche
                </a>
                <a href="bookshelf.html" class="nav-link active">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                    Ma Bibliothèque <span id="fav-count" class="badge"></span>
                </a>
                <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Changer de thème"></button>
            </nav>
        </div>
    </header>

    <section class="hero hero-small">
        <div class="container">
            <h1>Ma Bibliothèque</h1>
            <p class="hero-subtitle" id="shelf-subtitle"></p>
        </div>
    </section>

    <main class="container">
        <div class="toolbar shelf-toolbar">
            <div id="filter-tabs" class="filter-tabs">
                <button type="button" class="tab active" data-status="all">Tous</button>
                <button type="button" class="tab" data-status="toread">À lire</button>
                <button type="button" class="tab" data-status="reading">En cours</button>
                <button type="button" class="tab" data-status="read">Lus</button>
            </div>
            <input type="text" id="shelf-search" class="shelf-search"
                   placeholder="Filtrer ma bibliothèque…" aria-label="Filtrer ma bibliothèque">
        </div>

        <div id="empty-shelf" class="status status-empty" hidden></div>
        <div id="shelf" class="book-grid"></div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>BookLens — Anass El Hayel &amp; Salaheddine El Azouti<br>
               Données : <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a></p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/bookshelf.js"></script>
</body>
</html>
